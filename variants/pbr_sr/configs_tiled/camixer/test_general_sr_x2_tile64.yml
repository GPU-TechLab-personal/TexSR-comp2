# general settings
name: pbr_sr_camixer_x2
model_type: TileModel
scale: 2
num_gpu: 1
manual_seed: 0
ratio: 0.5
tile: 64

# network structures
network_g:
  type: CAMixerSR
  ratio: 0.5
  scale: 2

# path
path:
  pretrain_network_g: ./weights/CAMixerSR/CAMixerSRx2_DF.pth
  strict_load_g: true
  param_key_g: 'params_ema'

# validation settings
val:
  save_img: true
  suffix: '_sr_x2'
  use_chop: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
