<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBR-SR Viewer</title>
<!--
  Side-by-side viewer for the PBR-SR results. Started by view.py (it writes
  /runs/pbr_sr/viewer/manifest.json and serves the repo root).

  Shading follows PBR-SR's renderer (external/PBR-SR/nvdiff_render), not three.js defaults:
   - kd is the PNG value used as linear albedo, and the render is written out without sRGB
     encoding or tone mapping (texture.py:161-167, util.py:442-447, material.py:161-162;
     no rgb_to_srgb in run_pbr_sr.py). Default display = that. "sRGB" is offered as an option.
   - ks = (1 - AO, roughness, metallic). AO multiplies the whole shaded colour:
     light.py:123  shaded_col * (1.0 - ks[..., 0:1]).  three's aoMap would only touch
     indirect light, so the multiply is patched in (onBeforeCompile).
   - roughness ks.g / metallic ks.b, F0 0.04, GGX alpha = r^2: same as MeshStandardMaterial.
   - normal map: tangent space, OpenGL green (render.py:92 opengl=True); tangents as
     mesh.py:206-245 (dP/du averaged per vertex, Gram-Schmidt, no handedness) -> w = +1.
   - light: data/irrmaps/mud_road_puresky_4k.hdr x 2.0 (env_scale_val), no rotation in
     PBR-SR. Its lat-long has -Z at the image centre (util.py:112); three's has +X there,
     so the env is turned 90 deg about Y (adjustable).
   - val cameras: 5 elevations x 20 angles, distance 3.25, FoV 5 (set1) / 10 (set2)
     (run_pbr_sr.py:759-773, pbr_sr/utils.py:95-133). PBR-SR renders on white.
  Close to PBR-SR, not bit-exact: three's IBL (PMREM, multi-scattering) differs from
  nvdiffrec's split-sum in the details.
-->
<style>
  :root { --bg:#16181d; --panel:#1f2229; --line:#2e323b; --text:#e6e8ec; --mute:#9aa1ad; --acc:#6aa9ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  body { display:flex; overflow:hidden; }
  aside { width:280px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding:12px 14px 40px; }
  aside h1 { font-size:15px; margin:2px 0 10px; }
  aside h2 { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em;
    margin:16px 0 6px; font-weight:600; }
  label { display:flex; align-items:center; gap:6px; margin:3px 0; cursor:pointer; }
  .grp { color:var(--mute); font-size:11px; margin:6px 0 1px; }
  select, button { background:#2a2e37; color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:4px 7px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  .row { display:flex; gap:6px; align-items:center; margin:4px 0; flex-wrap:wrap; }
  .row > span:first-child { min-width:72px; color:var(--mute); }
  input[type=range] { flex:1; min-width:90px; }
  .val { min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  .help { color:var(--mute); font-size:12px; margin-top:6px; }
  .help b { color:var(--text); font-weight:600; }
  main { position:relative; flex:1; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .lab { position:absolute; padding:4px 7px; font-size:12px; color:#111; background:rgba(255,255,255,.82);
    border-radius:0 0 6px 0; max-width:100%; }
  .lab b { font-size:13px; }
  .lab .m { font-size:11px; color:#333; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lab.dark { background:rgba(0,0,0,.6); color:#eee; } .lab.dark .m { color:#ccc; }
  #status { position:absolute; right:10px; bottom:8px; font-size:12px; color:var(--mute);
    background:rgba(0,0,0,.5); padding:3px 8px; border-radius:5px; }
  #status:empty { display:none; }
  #table { position:absolute; inset:24px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:14px; overflow:auto; display:none; z-index:5; }
  #table table { border-collapse:collapse; font-variant-numeric:tabular-nums; }
  #table th, #table td { padding:4px 9px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  #table th:first-child, #table td:first-child { text-align:left; }
  #table td.best { color:#7fe08a; font-weight:700; }
  #table .note { color:var(--mute); font-size:12px; margin-top:10px; max-width:900px; }
  @media (max-width: 760px) { body { flex-direction:column; } aside { width:100%; max-height:42%; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
</head>
<body>
<aside>
  <h1>PBR-SR 결과 뷰어</h1>
  <h2>결과</h2>
  <div id="panelList"></div>
  <div class="row"><button id="selFinal">최종만</button><button id="selInit">init만</button><button id="selAll">전부</button></div>

  <h2>보기</h2>
  <div class="row"><span>표시</span>
    <select id="mode">
      <option value="0">렌더 (PBR)</option>
      <option value="1">Albedo (kd)</option>
      <option value="2">Roughness</option>
      <option value="3">Metallic</option>
      <option value="4">AO</option>
      <option value="5">Normal map</option>
    </select></div>
  <label><input type="checkbox" id="showMetrics" checked> 지표 표시</label>
  <div class="row"><button id="tableBtn">지표 표</button><button id="shotBtn">PNG 저장</button></div>

  <h2>조명</h2>
  <div class="row"><span>회전</span><input type="range" id="envRot" min="-180" max="180" step="5" value="90"><span class="val" id="envRotV"></span></div>
  <div class="row"><span>밝기</span><input type="range" id="envInt" min="0.25" max="6" step="0.25" value="2"><span class="val" id="envIntV"></span></div>
  <div class="row"><span>배경</span>
    <select id="bg"><option value="white">흰색 (PBR-SR)</option><option value="gray">회색</option><option value="black">검정</option><option value="env">환경맵</option></select></div>
  <div class="row"><span>출력</span>
    <select id="out"><option value="linear">PBR-SR 그대로 (linear)</option><option value="srgb">sRGB 변환</option></select></div>
  <label><input type="checkbox" id="ao" checked> AO 적용 (1 − ks.R 곱하기)</label>
  <label><input type="checkbox" id="nmap" checked> Normal map 사용</label>
  <label><input type="checkbox" id="nflip"> Normal Y 반전 (확인용)</label>

  <h2>카메라</h2>
  <div class="row"><button id="camFree">전체 보기</button>
    <select id="valSet"><option value="10">검증 set2 (FoV 10)</option><option value="5">검증 set1 (FoV 5)</option></select></div>
  <div class="row"><span>고도</span><input type="range" id="valElev" min="0" max="4" step="1" value="2"><span class="val" id="valElevV"></span></div>
  <div class="row"><span>방위</span><input type="range" id="valAng" min="0" max="19" step="1" value="0"><span class="val" id="valAngV"></span></div>
  <div class="row"><button id="camVal">검증 시점으로</button></div>

  <h2>텍스처</h2>
  <div class="row"><span>해상도</span>
    <select id="res"><option value="0">원본 (4096)</option><option value="2048">2048 (메모리 절약)</option></select></div>

  <div class="help">
    <b>드래그</b> 회전 · <b>우클릭 드래그</b> 이동 · <b>휠</b> 확대<br>
    <b>더블클릭</b> 그 결과만 크게 / 다시 더블클릭 또는 <b>Esc</b> 복귀<br>
    크게 볼 때 <b>← →</b> 또는 <b>숫자키</b>로 결과 전환 (같은 시점 깜빡이며 비교)
  </div>
</aside>
<main id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="status"></div>
  <div id="table"></div>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const BASE = '/runs/pbr_sr/viewer/';
const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t || ''; };

let man;
try { man = await (await fetch(BASE + 'manifest.json')).json(); }
catch (e) { status('manifest.json 없음 - view.py로 실행하세요'); throw e; }

// ---------------------------------------------------------------- renderer, camera
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const aniso = renderer.capabilities.getMaxAnisotropy();
if (renderer.capabilities.maxTextureSize < 4096) $('res').value = '2048';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.15;
controls.zoomSpeed = 1.2;
let dirty = true;
controls.addEventListener('change', () => { dirty = true; });

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  status('GPU 메모리 부족으로 WebGL이 끊겼습니다. 텍스처 해상도를 2048로 바꾸거나 결과 수를 줄이고 새로고침하세요.');
});

// ---------------------------------------------------------------- environment (PBR-SR's val light)
const shared = { ao: { value: 1.0 } };
let envTex = null, hdrTex = null;
if (man.env) {
  status('환경맵 불러오는 중…');
  hdrTex = await new RGBELoader().loadAsync(man.env);
  hdrTex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  envTex = pmrem.fromEquirectangular(hdrTex).texture;
  pmrem.dispose();
}
renderer.setScissorTest(true);

// ---------------------------------------------------------------- OBJ + PBR-SR tangents
function parseOBJ(text) {
  const P = [], T = [], N = [];
  const map = new Map(), pos = [], uv = [], nrm = [], nid = [], idx = [];
  const vert = tok => {
    let k = map.get(tok);
    if (k !== undefined) return k;
    const [a, b, c] = tok.split('/').map(s => parseInt(s, 10) - 1);
    k = pos.length / 3; map.set(tok, k);
    pos.push(P[3 * a], P[3 * a + 1], P[3 * a + 2]);
    uv.push(T[2 * b] ?? 0, T[2 * b + 1] ?? 0);
    nrm.push(N[3 * c] ?? 0, N[3 * c + 1] ?? 0, N[3 * c + 2] ?? 1);
    nid.push(c);
    return k;
  };
  for (const line of text.split('\n')) {
    const s = line.trim().split(/\s+/);
    if (s[0] === 'v') P.push(+s[1], +s[2], +s[3]);
    else if (s[0] === 'vt') T.push(+s[1], +s[2]);
    else if (s[0] === 'vn') N.push(+s[1], +s[2], +s[3]);
    else if (s[0] === 'f') {
      const f = s.slice(1).map(vert);
      for (let i = 1; i + 1 < f.length; i++) idx.push(f[0], f[i], f[i + 1]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setIndex(idx);
  // mesh.py:206-245 - per triangle dP/du from PBR-SR's internal uv (v' = 1 - v),
  // summed per normal index, averaged, normalised, made perpendicular to the normal.
  const nN = N.length / 3, acc = new Float64Array(nN * 3), cnt = new Float64Array(nN);
  for (let t = 0; t < idx.length; t += 3) {
    const [i0, i1, i2] = [idx[t], idx[t + 1], idx[t + 2]];
    const u0 = uv[2 * i0], v0 = 1 - uv[2 * i0 + 1];
    const e1u = uv[2 * i1] - u0, e1v = (1 - uv[2 * i1 + 1]) - v0;
    const e2u = uv[2 * i2] - u0, e2v = (1 - uv[2 * i2 + 1]) - v0;
    let den = e1u * e2v - e1v * e2u;
    den = den > 0 ? Math.max(den, 1e-6) : Math.min(den, -1e-6);
    const tg = [0, 1, 2].map(c => {
      const p1 = pos[3 * i1 + c] - pos[3 * i0 + c], p2 = pos[3 * i2 + c] - pos[3 * i0 + c];
      return (p1 * e2v - p2 * e1v) / den;
    });
    for (const i of [i0, i1, i2]) {
      const n = nid[i];
      acc[3 * n] += tg[0]; acc[3 * n + 1] += tg[1]; acc[3 * n + 2] += tg[2]; cnt[n] += 1;
    }
  }
  const tan = new Float32Array(pos.length / 3 * 4);
  for (let i = 0; i < pos.length / 3; i++) {
    const n = nid[i];
    let x = acc[3 * n] / (cnt[n] || 1), y = acc[3 * n + 1] / (cnt[n] || 1), z = acc[3 * n + 2] / (cnt[n] || 1);
    let l = Math.hypot(x, y, z) || 1; x /= l; y /= l; z /= l;
    const nx = nrm[3 * i], ny = nrm[3 * i + 1], nz = nrm[3 * i + 2], d = x * nx + y * ny + z * nz;
    x -= d * nx; y -= d * ny; z -= d * nz;
    l = Math.hypot(x, y, z);
    if (l < 1e-8) { x = 1; y = 0; z = 0; l = 1; }
    tan.set([x / l, y / l, z / l, 1], 4 * i);
  }
  g.setAttribute('tangent', new THREE.BufferAttribute(tan, 4));
  g.computeBoundingSphere();
  return g;
}

// ---------------------------------------------------------------- textures (raw values, no colour management)
async function loadTex(url, size) {
  const blob = await (await fetch(url)).blob();
  const opt = { imageOrientation: 'flipY', premultiplyAlpha: 'none', colorSpaceConversion: 'none' };
  let bmp = await createImageBitmap(blob, opt);
  if (size && bmp.width > size) {
    bmp.close();
    bmp = await createImageBitmap(blob, { ...opt, resizeWidth: size, resizeHeight: size, resizeQuality: 'high' });
  }
  const t = new THREE.Texture(bmp);
  t.flipY = false;                  // already flipped: OBJ v = 0 is the image bottom
  t.colorSpace = THREE.NoColorSpace;
  t.anisotropy = aniso;
  t.needsUpdate = true;
  return t;
}

// ---------------------------------------------------------------- materials
function pbrMaterial(tex) {
  const m = new THREE.MeshStandardMaterial({
    map: tex.kd, roughnessMap: tex.ks, metalnessMap: tex.ks, normalMap: tex.n,
    roughness: 1, metalness: 1, side: THREE.DoubleSide, envMap: envTex,
  });
  m.envMapIntensity = +$('envInt').value;
  m.envMapRotation.set(0, THREE.MathUtils.degToRad(+$('envRot').value), 0);
  m.onBeforeCompile = sh => {
    sh.uniforms.aoOn = shared.ao;
    sh.fragmentShader = 'uniform float aoOn;\n' + sh.fragmentShader.replace('#include <opaque_fragment>',
      `#ifdef USE_ROUGHNESSMAP
        outgoingLight *= mix( 1.0, 1.0 - texture2D( roughnessMap, vRoughnessMapUv ).r, aoOn );
      #endif
      #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'pbrsr-ao';
  return m;
}
const mapsVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const mapsFS = `uniform sampler2D kd, ks, nm; uniform int mode; varying vec2 vUv;
void main(){ vec3 c;
  if (mode == 1) c = texture2D(kd, vUv).rgb;
  else if (mode == 2) c = vec3(texture2D(ks, vUv).g);
  else if (mode == 3) c = vec3(texture2D(ks, vUv).b);
  else if (mode == 4) c = vec3(1.0 - texture2D(ks, vUv).r);
  else c = texture2D(nm, vUv).rgb;
  gl_FragColor = vec4(c, 1.0); }`;
const mapsUniformMode = { value: 1 };
function mapsMaterial(tex) {
  return new THREE.ShaderMaterial({ vertexShader: mapsVS, fragmentShader: mapsFS, side: THREE.DoubleSide,
    uniforms: { kd: { value: tex.kd }, ks: { value: tex.ks }, nm: { value: tex.n }, mode: mapsUniformMode } });
}

// ---------------------------------------------------------------- panels
const panels = man.panels.map(p => ({ ...p, mesh: null, loading: null, meshUrl: p.mesh }));
const byId = Object.fromEntries(panels.map(p => [p.id, p]));
const groupName = { gt: 'GT / 입력', lr: 'GT / 입력', paper: '기준 (논문 init)', matup: 'MatUp init',
  matup_ft: 'MatUp-ft init', deeptex: 'DeepTex-R21 init' };
const DEFAULT = ['gt', 'lr', 'paper_final', 'matup_final', 'matup_ft_final', 'deeptex_final'];

const list = $('panelList');
let lastGrp = null;
for (const p of panels) {
  const g = groupName[p.group] || p.group;
  if (g !== lastGrp) { const d = document.createElement('div'); d.className = 'grp'; d.textContent = g; list.append(d); lastGrp = g; }
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" data-id="${p.id}"> ${p.label}`;
  list.append(l);
  p.box = l.querySelector('input');
  p.box.checked = DEFAULT.includes(p.id) || !panels.some(q => DEFAULT.includes(q.id));
  p.box.addEventListener('change', () => { solo = null; refresh(); });
}
const setSel = f => { for (const p of panels) p.box.checked = f(p); solo = null; refresh(); };
$('selFinal').onclick = () => setSel(p => p.stage === 'final' || p.stage === 'gt');
$('selInit').onclick = () => setSel(p => p.stage === 'init' || p.stage === 'gt');
$('selAll').onclick = () => setSel(() => true);

let loadedRes = +$('res').value;
async function ensureLoaded(p) {
  if (p.mesh) return;
  if (p.loading) return p.loading;
  p.loading = (async () => {
    const size = loadedRes || 0;
    const [text, kd, ks, n] = await Promise.all([
      fetch(BASE + p.meshUrl).then(r => r.text()),
      loadTex(BASE + p.maps.kd, size), loadTex(BASE + p.maps.ks, size), loadTex(BASE + p.maps.n, size)]);
    p.tex = { kd, ks, n };
    p.matPBR = pbrMaterial(p.tex);
    p.matMaps = mapsMaterial(p.tex);
    p.mesh = new THREE.Mesh(parseOBJ(text), p.matPBR);
    p.mesh.visible = false;
    applyMaterialState(p);
    scene.add(p.mesh);
    dirty = true;
  })();
  return p.loading;
}
function unload(p) {
  if (!p.mesh) return;
  scene.remove(p.mesh);
  p.mesh.geometry.dispose(); p.matPBR.dispose(); p.matMaps.dispose();
  for (const t of Object.values(p.tex)) { t.image?.close?.(); t.dispose(); }
  p.mesh = null; p.loading = null; p.tex = null;
}

let order = null;   // #panels=a,b,c also sets the grid order
const selected = () => {
  const s = panels.filter(p => p.box.checked);
  return order ? s.sort((a, b) => (order.indexOf(a.id) + 1 || 99) - (order.indexOf(b.id) + 1 || 99)) : s;
};
let solo = null;
async function refresh() {
  const sel = selected();
  layout();
  const todo = sel.filter(p => !p.mesh);
  let done = 0;
  if (todo.length) status(`불러오는 중 0/${todo.length}`);
  await Promise.all(todo.map(p => ensureLoaded(p).then(() => status(`불러오는 중 ${++done}/${todo.length}`))));
  status('');
  layout(); dirty = true;
}

// ---------------------------------------------------------------- state from the controls
function applyMaterialState(p) {
  const mode = +$('mode').value;
  p.mesh.material = mode === 0 ? p.matPBR : p.matMaps;
  const m = p.matPBR;
  m.envMapIntensity = +$('envInt').value;
  m.envMapRotation.set(0, THREE.MathUtils.degToRad(+$('envRot').value), 0);
  const wantN = $('nmap').checked ? p.tex.n : null;
  if (m.normalMap !== wantN) { m.normalMap = wantN; m.needsUpdate = true; }
  m.normalScale.set(1, $('nflip').checked ? -1 : 1);
}
function applyAll() {
  mapsUniformMode.value = Math.max(1, +$('mode').value);
  shared.ao.value = $('ao').checked ? 1 : 0;
  renderer.outputColorSpace = $('out').value === 'srgb' ? THREE.SRGBColorSpace : THREE.LinearSRGBColorSpace;
  const rot = THREE.MathUtils.degToRad(+$('envRot').value);
  scene.backgroundRotation.set(0, rot, 0);
  scene.backgroundIntensity = +$('envInt').value;
  const bg = $('bg').value;
  scene.background = bg === 'env' && hdrTex ? hdrTex
    : new THREE.Color(bg === 'white' ? 0xffffff : bg === 'gray' ? 0x808080 : 0x000000);
  for (const p of panels) if (p.mesh) applyMaterialState(p);
  $('envRotV').textContent = $('envRot').value + '°';
  $('envIntV').textContent = (+$('envInt').value).toFixed(2);
  updateLabels(); dirty = true;
}
for (const id of ['mode', 'ao', 'nmap', 'nflip', 'envRot', 'envInt', 'bg', 'out', 'showMetrics'])
  $(id).addEventListener('input', applyAll);
$('res').addEventListener('change', () => {
  loadedRes = +$('res').value;
  for (const p of panels) unload(p);
  refresh();
});

// ---------------------------------------------------------------- cameras
const ELEVS = [-Math.PI / 4, -Math.PI / 8, 0, Math.PI / 8, Math.PI / 4];
function valCamera() {
  const e = ELEVS[+$('valElev').value], a = 2 * Math.PI * (+$('valAng').value) / 19, r = 3.25;
  camera.fov = +$('valSet').value;
  camera.position.set(-Math.sin(a) * Math.cos(e) * r, -Math.sin(e) * r, Math.cos(a) * Math.cos(e) * r);
  controls.target.set(0, 0, 0);
  camera.updateProjectionMatrix(); controls.update(); dirty = true;
}
function freeCamera() {
  camera.fov = 30;
  camera.position.set(0, 0.35, 5.4);
  controls.target.set(0, 0, 0);
  camera.updateProjectionMatrix(); controls.update(); dirty = true;
}
function valLabels() {
  $('valElevV').textContent = Math.round(THREE.MathUtils.radToDeg(ELEVS[+$('valElev').value])) + '°';
  $('valAngV').textContent = Math.round(360 * (+$('valAng').value) / 19) + '°';
}
$('camFree').onclick = freeCamera;
$('camVal').onclick = valCamera;
for (const id of ['valElev', 'valAng', 'valSet']) $(id).addEventListener('input', () => { valLabels(); valCamera(); });

// ---------------------------------------------------------------- layout, labels
let rects = [];
function layout() {
  const W = $('stage').clientWidth, H = $('stage').clientHeight;
  const sel = selected();
  const shown = solo && byId[solo]?.box.checked ? [byId[solo]] : sel;
  if (!(solo && byId[solo]?.box.checked)) solo = null;
  rects = [];
  const n = shown.length;
  if (n) {
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols), w = W / cols, h = H / rows, s = Math.min(w, h);
      if (!best || s > best.s) best = { cols, rows, s };
    }
    const w = Math.floor(W / best.cols), h = Math.floor(H / best.rows);
    shown.forEach((p, i) => rects.push({ p, x: (i % best.cols) * w, y: Math.floor(i / best.cols) * h, w, h }));
  }
  updateLabels(); dirty = true;
}
const f3 = v => v == null ? '–' : v.toFixed(3).replace(/^0\./, '.');
const f2 = v => v == null ? '–' : v.toFixed(2);
function metricLine(p) {
  const r = p.metrics?.render, m = p.metrics?.maps;
  if (!r && !m) return '';
  let s = '';
  for (const k of ['set1', 'set2']) if (r?.[k])
    s += `<div class="m">${k} PSNR ${f2(r[k].psnr)} · SSIM ${f3(r[k].ssim)} · LPIPS ${f3(r[k].lpips)}</div>`;
  if (m) s += `<div class="m">맵 PSNR kd ${f2(m['Base color']?.psnr)} · r ${f2(m.Roughness?.psnr)} · m ${f2(m.Metallic?.psnr)} · n ${f2(m.Normal?.psnr)}</div>`;
  return s;
}
function updateLabels() {
  const dark = $('bg').value === 'black' || $('bg').value === 'env';
  const show = $('showMetrics').checked;
  $('labels').innerHTML = rects.map(({ p, x, y, w }) =>
    `<div class="lab${dark ? ' dark' : ''}" style="left:${x}px;top:${y}px;max-width:${w}px">
       <b>${p.label}</b> <span class="m">${p.res}²${p.mesh ? '' : ' · 불러오는 중'}</span>${show ? metricLine(p) : ''}</div>`).join('');
}

// ---------------------------------------------------------------- solo / keys
canvas.addEventListener('dblclick', e => {
  const b = canvas.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  if (solo) solo = null;
  else { const r = rects.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h); solo = r?.p.id ?? null; }
  layout();
});
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const sel = selected();
  if (e.key === 'Escape') { solo = null; $('table').style.display = 'none'; layout(); return; }
  if (!solo || !sel.length) return;
  let i = sel.findIndex(p => p.id === solo);
  if (e.key === 'ArrowRight') i = (i + 1) % sel.length;
  else if (e.key === 'ArrowLeft') i = (i - 1 + sel.length) % sel.length;
  else if (/^[1-9]$/.test(e.key) && +e.key <= sel.length) i = +e.key - 1;
  else if (e.key === '0' && sel.length >= 10) i = 9;
  else return;
  solo = sel[i].id; layout();
});

// ---------------------------------------------------------------- metrics table
$('tableBtn').onclick = () => {
  const t = $('table');
  if (t.style.display === 'block') { t.style.display = 'none'; return; }
  const rows = panels.filter(p => p.metrics);
  const cols = [
    ['set1 PSNR↑', p => p.metrics.render?.set1?.psnr, 1, f2], ['set1 SSIM↑', p => p.metrics.render?.set1?.ssim, 1, f3],
    ['set1 LPIPS↓', p => p.metrics.render?.set1?.lpips, -1, f3],
    ['set2 PSNR↑', p => p.metrics.render?.set2?.psnr, 1, f2], ['set2 SSIM↑', p => p.metrics.render?.set2?.ssim, 1, f3],
    ['set2 LPIPS↓', p => p.metrics.render?.set2?.lpips, -1, f3],
    ['kd PSNR↑', p => p.metrics.maps?.['Base color']?.psnr, 1, f2], ['rough PSNR↑', p => p.metrics.maps?.Roughness?.psnr, 1, f2],
    ['metal PSNR↑', p => p.metrics.maps?.Metallic?.psnr, 1, f2], ['AO PSNR↑', p => p.metrics.maps?.Occlusion?.psnr, 1, f2],
    ['normal PSNR↑', p => p.metrics.maps?.Normal?.psnr, 1, f2],
  ];
  const best = cols.map(([, get, dir]) => {
    const v = rows.filter(p => p.stage === 'final').map(get).filter(x => x != null);
    return v.length ? (dir > 0 ? Math.max(...v) : Math.min(...v)) : null;
  });
  t.innerHTML = `<table><tr><th>결과</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>` +
    rows.map(p => `<tr><td>${p.label}</td>${cols.map(([, get, , fmt], j) => {
      const v = get(p); return `<td class="${p.stage === 'final' && v != null && v === best[j] ? 'best' : ''}">${fmt(v)}</td>`;
    }).join('')}</tr>`).join('') + `</table>
    <div class="note">렌더 지표: PBR-SR 검증 렌더 100장 평균 (set1 FoV 5, set2 FoV 10, mud_road_puresky_4k, 흰 배경). init = step 0, 최종 = step 2000.
    맵 PSNR: PBR-SR 자체 계산 (UV 마스크 영역, peak = 예측 맵의 최댓값, normal은 범위 2, AO는 1−AO 공간). 초록 = 최종 결과 중 최고.
    Esc 또는 버튼으로 닫기.</div>`;
  t.style.display = 'block';
};

// ---------------------------------------------------------------- screenshot (labels drawn in)
function snapshot() {
  draw();
  const pr = renderer.getPixelRatio();
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const g = out.getContext('2d');
  g.drawImage(canvas, 0, 0);
  const show = $('showMetrics').checked;
  for (const { p, x, y } of rects) {
    const lines = [[`${p.label}  (${p.res}²)`, 'bold 13px']];
    if (show) {
      const r = p.metrics?.render, m = p.metrics?.maps;
      for (const k of ['set1', 'set2']) if (r?.[k])
        lines.push([`${k} PSNR ${f2(r[k].psnr)} · SSIM ${f3(r[k].ssim)} · LPIPS ${f3(r[k].lpips)}`, '11px']);
      if (m) lines.push([`맵 PSNR kd ${f2(m['Base color']?.psnr)} · r ${f2(m.Roughness?.psnr)} · m ${f2(m.Metallic?.psnr)} · n ${f2(m.Normal?.psnr)}`, '11px']);
    }
    const font = s => `${s.replace(/(\d+)px/, (_, n) => n * pr + 'px')} "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif`;
    let w = 0;
    for (const [t, f] of lines) { g.font = font(f); w = Math.max(w, g.measureText(t).width); }
    const lh = 16 * pr, pad = 6 * pr;
    const dark = $('bg').value === 'black' || $('bg').value === 'env';
    g.fillStyle = dark ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.82)';
    g.fillRect(x * pr, y * pr, w + 2 * pad, lines.length * lh + pad);
    g.fillStyle = dark ? '#eee' : '#111';
    g.textBaseline = 'top';
    lines.forEach(([t, f], i) => { g.font = font(f); g.fillText(t, x * pr + pad, y * pr + pad / 2 + i * lh + 1); });
  }
  return new Promise(res => out.toBlob(res, 'image/png'));
}
$('shotBtn').onclick = async () => {
  const b = await snapshot();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `pbrsr_${solo || 'grid'}_${Date.now()}.png`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------------------------------------------------------------- draw loop
function draw() {
  const W = $('stage').clientWidth, H = $('stage').clientHeight;
  const size = renderer.getSize(new THREE.Vector2());
  if (size.x !== W || size.y !== H) { renderer.setSize(W, H, false); layout(); }
  renderer.setScissorTest(true);
  renderer.setScissor(0, 0, W, H); renderer.setViewport(0, 0, W, H);
  renderer.setClearColor(0x202228, 1); renderer.clear();
  for (const p of panels) if (p.mesh) p.mesh.visible = false;
  for (const { p, x, y, w, h } of rects) {
    if (!p.mesh) continue;
    p.mesh.visible = true;
    renderer.setViewport(x, H - y - h, w, h);
    renderer.setScissor(x, H - y - h, w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    p.mesh.visible = false;
  }
  dirty = false;
}
window.addEventListener('resize', () => { layout(); });
function loop() {
  requestAnimationFrame(loop);
  if (controls.update() || dirty) draw();
}

// URL hash, e.g. #panels=gt,lr,paper_final&cam=val:2:0:5&mode=0&solo=gt
// (cam=val:<elev 0-4>:<angle 0-19>:<FoV 5|10>; mode 0 render .. 5 normal map)
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('panels')) {
  const want = hash.get('panels') === 'all' ? panels.map(p => p.id) : hash.get('panels').split(',');
  for (const p of panels) p.box.checked = want.includes(p.id);
  order = want;
}
if (hash.get('mode')) $('mode').value = hash.get('mode');
if (hash.get('bg')) $('bg').value = hash.get('bg');
if (hash.get('solo')) solo = hash.get('solo');
valLabels(); freeCamera();
const cam = (hash.get('cam') || '').split(':');
if (cam[0] === 'val') {
  [$('valElev').value, $('valAng').value, $('valSet').value] = [cam[1] ?? 2, cam[2] ?? 0, cam[3] ?? 10];
  valLabels(); valCamera();
} else if (cam[0] === 'pos') {   // cam=pos:x,y,z:tx,ty,tz:fov
  const [p, t] = [cam[1], cam[2] || '0,0,0'].map(s => s.split(',').map(Number));
  camera.position.set(...p); controls.target.set(...t);
  camera.fov = +(cam[3] || 30); camera.updateProjectionMatrix(); controls.update();
}
if (hash.get('res')) { $('res').value = hash.get('res'); loadedRes = +hash.get('res'); }
if (hash.get('ui') === '0') { document.querySelector('aside').style.display = 'none'; }
if (hash.get('metrics') === '0') $('showMetrics').checked = false;
applyAll(); loop();
await refresh();
// #shot=<name>: once everything is loaded and drawn, save the labelled PNG through view.py
// (runs/pbr_sr/viewer/shots/<name>.png) - for scripted captures, e.g. headless Chrome
if (hash.get('shot')) {
  for (let i = 0; i < 3; i++) await new Promise(r => requestAnimationFrame(r));
  const b = await snapshot();
  await fetch('/__shot/' + encodeURIComponent(hash.get('shot')), { method: 'POST', body: b });
  status('saved runs/pbr_sr/viewer/shots/' + hash.get('shot') + '.png');
}
</script>
</body>
</html>
